<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ASTRAC Instruction Reference</title>

<style>

/* ==========================================================
   ASTRAC Reference
   Early-90s Manpage Style
   ========================================================== */

:root {
    --bg: #f3e7c3;
    --paper: #fff9d6;

    --ink: #000;
    --muted: #444;
    --accent: #0000ee;

    --border: #000;
    --hover: #eee8b8;

    --success: #d7ffd7;
    --warning: #fff2a8;
    --danger: #ffd0d0;

    --mono: "Courier New", Courier, monospace;
}

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--mono);
    min-height: 100%;
}

body {
    padding: 20px;
}

/* ==========================================================
   Main Container
   ========================================================== */

main {
    max-width: 1200px;
    margin: auto;
    background: var(--paper);
    border: 2px solid var(--border);
    padding: 20px;
}

/* ==========================================================
   Header
   ========================================================== */

header {
    position: sticky;
    top: 0;

    background: var(--paper);

    border-bottom: 2px solid var(--border);

    padding-bottom: 12px;
    margin-bottom: 20px;

    z-index: 10;
}

header h1 {
    text-transform: uppercase;
    font-size: 28px;
    margin-bottom: 12px;
}

.controls {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
}

.controls input,
.controls select {
    font: inherit;

    background: white;

    border: 1px solid var(--border);

    padding: 4px 6px;
}

.controls input {
    flex: 1;
    min-width: 240px;
}

.controls input:focus,
.controls select:focus {
    outline: 2px solid var(--accent);
}

#count {
    color: var(--muted);
}

/* ==========================================================
   Links
   ========================================================== */

a {
    color: var(--accent);
    text-decoration: underline;
}

/* ==========================================================
   Table
   ========================================================== */

table {
    width: 100%;
    border-collapse: collapse;
}

thead th {
    position: sticky;
    top: 92px;

    background: #eee8b8;

    border: 1px solid var(--border);

    padding: 6px;

    text-align: left;

    cursor: pointer;

    text-transform: uppercase;
}

thead th:hover {
    background: var(--hover);
}

tbody td {
    border: 1px solid var(--border);
    padding: 6px;
    vertical-align: top;
}

tbody tr:not(.details):hover {
    background: var(--hover);
}

/* ==========================================================
   Details
   ========================================================== */

.details td {
    background: #fffef0;
    padding: 16px;
}

.details-grid {
    display: grid;
    gap: 20px;
    grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
}

.details-grid h3 {
    text-transform: uppercase;
    margin-bottom: 8px;
}

/* ==========================================================
   Mini Tables
   ========================================================== */

.mini {
    width: 100%;
    border-collapse: collapse;
}

.mini td {
    border: 1px solid var(--border);
    padding: 4px;
}

.mini td:first-child {
    width: 40%;
    color: var(--muted);
}

/* ==========================================================
   Badges
   ========================================================== */

.badge {
    display: inline-block;

    margin: 2px;
    padding: 2px 5px;

    border: 1px solid var(--border);

    background: white;

    font-size: 12px;

    font-weight: normal;
}

.badge.encoding::before { content: "[ENC] "; }
.badge.cpu::before      { content: "[CPU] "; }
.badge.mode::before     { content: "[MODE] "; }
.badge.memory::before   { content: "[MEM] "; }
.badge.flag::before     { content: "[FLAG] "; }

.badge.success {
    background: var(--success);
}

.badge.warning {
    background: var(--warning);
}

.badge.danger {
    background: var(--danger);
}

/* ==========================================================
   Text
   ========================================================== */

.opcode,
code {
    font-family: var(--mono);
    font-weight: bold;
}

.desc {
    color: var(--ink);
}

.empty {
    color: var(--muted);
    font-style: italic;
}

/* ==========================================================
   Lists
   ========================================================== */

.operands,
.tested,
.modified,
.defined,
.undefined {
    display: flex;
    flex-wrap: wrap;
    gap: 4px;
    margin: 6px 0 14px;
}

/* ==========================================================
   Sort Arrow
   ========================================================== */

.sort-arrow {
    color: var(--accent);
    margin-left: 4px;
}

/* ==========================================================
   Scrollbar
   ========================================================== */

::-webkit-scrollbar {
    width: 12px;
    height: 12px;
}

::-webkit-scrollbar-track {
    background: var(--paper);
}

::-webkit-scrollbar-thumb {
    background: #bbb;
    border: 1px solid black;
}

::-webkit-scrollbar-thumb:hover {
    background: #999;
}

/* ==========================================================
   Responsive
   ========================================================== */

@media (max-width: 900px) {

    header,
    thead th {
        position: static;
    }

    table {
        display: block;
        overflow-x: auto;
    }

    .controls {
        flex-direction: column;
    }

    .controls input {
        min-width: auto;
    }

    .details-grid {
        grid-template-columns: 1fr;
    }
}
</style>

</head>

<body>

<header>
    <h1>ASTRAC ASSEMBLY Instruction Reference</h1>
    <h4>Click on a mnemonic to view detailed information.</h4>
    <div class="controls">

        <input
            id="search"
            type="text"
            placeholder="Search..."
        >

        <select id="field">
            <option value="all">All Fields</option>
            <option value="name">Mnemonic</option>
            <option value="description">Description</option>
            <option value="encoding">Encoding</option>
            <option value="processor">Processor</option>
            <option value="mode">CPU Mode</option>
            <option value="opcode">Opcode</option>
            <option value="memory">Memory</option>
            <option value="status">Status</option>
        </select>

        <span id="count"></span>

    </div>
</header>

<main>

<table id="mnemonicTable">

<thead>

<tr>

<th data-field="mnemonic">ID</th>

<th data-field="name">Mnemonic</th>

<th data-field="opcode">Opcode</th>

<th data-field="encoding">Encoding</th>

<th data-field="operand_count">Operands</th>

<th data-field="size">Size</th>

<th data-field="processor">CPU</th>

<th data-field="mode">Mode</th>

<th data-field="memory">Memory</th>

<th data-field="description">Description</th>

</tr>

</thead>

<tbody>

</tbody>

</table>

</main>

<td>Prefix</td>

</tr>

<tr>
<td>Opcode Prefix</td>
<td class="opcodePrefix"></td>
</tr>

<tr>

<td class="reg"></td>
</tr>

<td class="modrm"></td>
</tr>

<td class="rel"></td>
</tr>

</div>

</div>

<script>
/* ==========================================================
   Part 3A
   Loading, formatting and rendering
   ========================================================== */

let mnemonics = [];
let filtered = [];

let sortField = "mnemonic";
let sortAscending = true;

const tbody = document.querySelector("#mnemonicTable tbody");
const searchBox = document.getElementById("search");
const fieldBox = document.getElementById("field");
const countLabel = document.getElementById("count");

/* ---------------------------------------------------------- */

function loadDatabase() {

    const json = document.getElementById("mnemonics-data").textContent;

    mnemonics = JSON.parse(json);

    filtered = [...mnemonics];

    sortData();
    renderTable();
}

/* ---------------------------------------------------------- */

function opcodeString(op) {

    if (!op)
        return "";

    return op
        .map(v => String(v).toString(16).toUpperCase().padStart(2, "0"))
        .join(" ");
}

/* ---------------------------------------------------------- */

function badge(text, cls = "") {

    const span = document.createElement("span");

    span.className = "badge " + cls;

    span.textContent = text;

    return span;
}

/* ---------------------------------------------------------- */

function fillBadges(container, array, cls = "flag") {

    container.innerHTML = "";

    if (!array || array.length === 0) {

        const e = document.createElement("span");
        e.className = "empty";
        e.textContent = "None";

        container.appendChild(e);

        return;
    }

    array.forEach(v => container.appendChild(badge(v, cls)));
}

/* ---------------------------------------------------------- */

function createRow(m) {

    const tr = document.createElement("tr");

    tr.className = "mnemonic";

    tr.innerHTML = `
        <td>${m.mnemonic}</td>
        <td><b>${m.name}</b></td>
        <td class="opcode">${opcodeString(m.opcode)}</td>
        <td>${m.encoding}</td>
        <td>${m.operand_count}</td>
        <td>${m.size}</td>
        <td>${m.processor}</td>
        <td>${m.mode}</td>
        <td>${m.memory}</td>
        <td class="desc">${m.description || ""}</td>
    `;

    tr.addEventListener("click", () => {

        const next = tr.nextElementSibling;

        if (next && next.classList.contains("details")) {

            next.remove();
            return;
        }

        document
            .querySelectorAll(".details")
            .forEach(x => x.remove());

        tr.after(createDetails(m));

    });

    return tr;
}

/* ---------------------------------------------------------- */

function createDetails(m) {

    const template = document
        .getElementById("detailsTemplate")
        .content
        .cloneNode(true);

    const row = template.querySelector(".details");

    fillBadges(
        row.querySelector(".operands"),
        m.operand
    );

    fillBadges(
        row.querySelector(".tested"),
        m.tested_flags
    );

    fillBadges(
        row.querySelector(".modified"),
        m.modified_flags
    );

    fillBadges(
        row.querySelector(".defined"),
        m.defined_flags
    );

    fillBadges(
        row.querySelector(".undefined"),
        m.undefined_flags
    );

    row.querySelector(".prefix").textContent =
        m.prefix;

    row.querySelector(".opcodePrefix").textContent =
        m.opcode_prefix;

    row.querySelector(".reg").textContent =
        m.reg_fixed;

    row.querySelector(".modrm").textContent =
        m.modrm_ext;

    row.querySelector(".rel").textContent =
        m.rel_type;

    row.querySelector(".lock").textContent =
        m.lock_type;

    row.querySelector(".ext").textContent =
        m.opcode_ext;

    return row;
}

/* ---------------------------------------------------------- */

function renderTable() {

    tbody.innerHTML = "";

    filtered.forEach(m =>
        tbody.appendChild(createRow(m))
    );

    countLabel.textContent =
        `${filtered.length} / ${mnemonics.length} instructions`;
}

/* ==========================================================
   Part 3B
   Searching, sorting and initialization
   ========================================================== */

function compareValues(a, b) {

    if (typeof a === "number" && typeof b === "number")
        return a - b;

    return String(a).localeCompare(
        String(b),
        undefined,
        {
            numeric: true,
            sensitivity: "base"
        }
    );
}

/* ---------------------------------------------------------- */

function getFieldValue(m, field) {

    switch (field) {

        case "opcode":
            return opcodeString(m.opcode);

        case "operand":
            return m.operand.join(" ");

        case "tested_flags":
            return m.tested_flags.join(" ");

        case "modified_flags":
            return m.modified_flags.join(" ");

        case "defined_flags":
            return m.defined_flags.join(" ");

        case "undefined_flags":
            return m.undefined_flags.join(" ");

        case "flags_value":
            return m.flags_value.join(" ");

        default:
            return m[field];
    }

}

/* ---------------------------------------------------------- */

function sortData() {

    filtered.sort((a, b) => {

        let av = getFieldValue(a, sortField);
        let bv = getFieldValue(b, sortField);

        let result = compareValues(av, bv);

        return sortAscending ? result : -result;

    });

}

/* ---------------------------------------------------------- */

function applySearch() {

    const search = searchBox.value
        .trim()
        .toLowerCase();

    const field = fieldBox.value;

    if (search === "") {

        filtered = [...mnemonics];

        sortData();
        renderTable();

        return;
    }

    filtered = mnemonics.filter(m => {

        if (field === "all") {

            return Object.values(m).some(v => {

                if (Array.isArray(v))
                    return v.join(" ").toLowerCase().includes(search);

                return String(v)
                    .toLowerCase()
                    .includes(search);

            });

        }

        let value = getFieldValue(m, field);

        if (Array.isArray(value))
            value = value.join(" ");

        return String(value)
            .toLowerCase()
            .includes(search);

    });

    sortData();
    renderTable();

}

/* ---------------------------------------------------------- */

function clearSortIndicators() {

    document
        .querySelectorAll("th")
        .forEach(th => {

            th.querySelectorAll(".sort-arrow")
                .forEach(x => x.remove());

        });

}

/* ---------------------------------------------------------- */

function updateSortIndicators() {

    clearSortIndicators();

    const th = document.querySelector(
        `th[data-field="${sortField}"]`
    );

    if (!th)
        return;

    const span = document.createElement("span");

    span.className = "sort-arrow";

    span.textContent =
        sortAscending ? "▲" : "▼";

    th.appendChild(span);

}

/* ---------------------------------------------------------- */

function installSorting() {

    document
        .querySelectorAll("th[data-field]")
        .forEach(th => {

            th.addEventListener("click", () => {

                const field = th.dataset.field;

                if (sortField === field)
                    sortAscending = !sortAscending;
                else {

                    sortField = field;
                    sortAscending = true;

                }

                sortData();
                renderTable();
                updateSortIndicators();

            });

        });

}

/* ---------------------------------------------------------- */

function installSearching() {

    searchBox.addEventListener(
        "input",
        applySearch
    );

    fieldBox.addEventListener(
        "change",
        applySearch
    );

}

/* ---------------------------------------------------------- */

document.addEventListener("keydown", e => {

    if (
        e.key === "/" &&
        document.activeElement !== searchBox
    ) {

        e.preventDefault();

        searchBox.focus();

    }

});

/* ---------------------------------------------------------- */

window.addEventListener("load", async () => {

    installSorting();

    installSearching();

    updateSortIndicators();

    try {

        await loadDatabase();

    }
    catch (err) {

        tbody.innerHTML = `
            <tr>
                <td colspan="10" style="color:#ff7777">
                    Failed to load <code>WEB/mnemonics.json</code><br><br>
                    ${err}
                </td>
            </tr>
        `;

        console.error(err);

    }

});

</script>
